name: check and deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/verify-release.test.mjs
      - run: npm run check
      - run: npm run build
      - run: bash scripts/release-checks/revision.sh

  production-health-read:
    # Read-only pre-merge diagnostic requested for the Phase G candidate.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 63
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Read the existing public health response
        run: |
          body="$RUNNER_TEMP/kachka-health.json"
          meta=$(curl --silent --show-error --proto '=https' --max-time 15 --connect-timeout 5 \
            -o "$body" -w '%{http_code}\n%header{content-type}\n%header{cache-control}' https://kachka.fun/api/health)
          status=$(sed -n '1p' <<< "$meta")
          echo "Public health HTTP $status"
          test "$status" = 200
          sed -n '2p' <<< "$meta" | grep -Eiq '^application/json([[:space:]]*;|$)'
          sed -n '3p' <<< "$meta" | grep -Eiq '(^|,)[[:space:]]*no-store[[:space:]]*(,|$)'
          revision=$(jq -er 'select(.status == "ok") | .sha | strings | select(test("^([0-9a-f]{12}|[0-9a-f]{40})$"))' "$body")
          echo "::notice title=Public health::HTTP 200, valid JSON, no-store, running SHA $revision"
          echo "Valid JSON, no-store, running SHA $revision" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    # Merging to main deploys, but only after the checks pass.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Ask Dokploy to build and deploy this commit
        env:
          # A URL that can only redeploy this one app. Set by the repo owner under
          # Settings > Secrets and variables > Actions.
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo "DOKPLOY_DEPLOY_URL is not set; deployment cannot be requested."
            exit 1
          fi
          # Dokploy expects the shape of a GitHub push event and checks the branch in it.
          # Note: Cloudflare's Bot Fight Mode on the panel's zone must stay off, or it answers
          # this runner with a 403 challenge page and the request never arrives.
          code=$(curl --silent --proto '=https' --connect-timeout 5 --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$DOKPLOY_DEPLOY_URL" \
            -H 'content-type: application/json' \
            -H 'x-github-event: push' \
            -d "{\"ref\":\"refs/heads/main\",\"head_commit\":{\"id\":\"$GITHUB_SHA\",\"message\":\"deploy $GITHUB_SHA\"}}")
          echo "Dokploy answered $code"
          test "$code" -ge 200 && test "$code" -lt 300
      - name: Confirm the deployed revision on the public origin
        run: node scripts/verify-release.mjs https://kachka.fun "$GITHUB_SHA"
