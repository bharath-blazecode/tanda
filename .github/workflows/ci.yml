name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

# Deploys are not triggered from here. Cloudflare challenges calls from GitHub's runners to the
# Dokploy panel (403 "Just a moment..."), so the call never arrives. Dokploy is told about a push by a
# repository webhook instead (Settings > Webhooks, push events), or by a manual deploy from the panel.
